<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Вызов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url('img/hero.jpg');
      background-size: cover;
      background-position: center top;
      z-index: 1;
      pointer-events: none;
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.15) 35%,
        rgba(0, 0, 0, 0.25) 65%,
        rgba(0, 0, 0, 0.85) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    body.in-call .bg-layer {
      filter: brightness(0.65) blur(3px);
      transform: scale(1.03);
    }

    .call-screen {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 24px) + 36px) 24px calc(env(safe-area-inset-bottom, 24px) + 36px);
    }

    .caller-info {
      text-align: center;
      margin-top: 10px;
    }

    .caller-name {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
      padding: 8px;
      cursor: pointer;
    }

    .caller-status {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
      padding: 6px;
      cursor: pointer;
    }

    .incoming-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px 12px;
    }

    .btn-circle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease;
    }

    .btn-circle:active {
      transform: scale(0.9);
    }

    .btn-decline {
      background: #ff3b30;
      color: #fff;
    }

    .btn-accept {
      background: #34c759;
      color: #fff;
      animation: pulse-green 1.8s infinite;
    }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.65); }
      70% { box-shadow: 0 0 0 20px rgba(52, 199, 89, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }

    .btn-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .active-controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding-bottom: 10px;
    }

    body.in-call .incoming-controls {
      display: none;
    }

    body.in-call .active-controls {
      display: flex;
    }

    .call-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 26px;
      width: 100%;
      max-width: 310px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .grid-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .grid-btn.active {
      background: #ffffff;
      color: #000000;
    }

    .grid-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    .standby-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 15px;
      cursor: pointer;
    }

    .standby-screen.visible {
      display: flex;
    }

    .secret-modal {
      position: fixed;
      inset: 0;
      background: rgba(12, 12, 16, 0.98);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 20px 18px 36px;
      overflow-y: auto;
    }

    .secret-modal.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a32;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .btn-close-modal {
      background: #2c2c35;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .setting-group {
      margin-bottom: 18px;
      background: #15151a;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #25252e;
    }

    .setting-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #b4b7c2;
      margin-bottom: 10px;
    }

    .setting-input, .setting-select {
      width: 100%;
      background: #1e1e26;
      border: 1px solid #32323c;
      color: #fff;
      padding: 11px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .row-flex {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      background: #2b5278;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Блок диктофона */
    .rec-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-rec {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #ff3b30;
      color: #fff;
    }

    .btn-rec.recording {
      background: #ff9500;
      color: #000;
      animation: blink-rec 1s infinite;
    }

    @keyframes blink-rec {
      50% { opacity: 0.7; }
    }

    .btn-preview {
      padding: 12px 16px;
      border: 1px solid #3a3a46;
      border-radius: 10px;
      background: #252530;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-preview:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pitch-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .pitch-btn {
      background: #1e1e26;
      border: 1px solid #32323c;
      color: #ccc;
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }

    .pitch-btn.selected {
      background: #2c4a36;
      border-color: #34c759;
      color: #fff;
      font-weight: 600;
    }

    .preset-pills {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .preset-btn {
      background: #1e1e26;
      border: 1px solid #32323c;
      color: #ddd;
      padding: 11px;
      border-radius: 10px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .preset-btn.selected {
      background: #1f3a52;
      border-color: #4da3ff;
      color: #fff;
      font-weight: 500;
    }

    .btn-launch {
      width: 100%;
      background: #34c759;
      color: #000;
      font-weight: 600;
      font-size: 16px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 6px;
      cursor: pointer;
    }

    .status-hint {
      font-size: 12px;
      color: #8b8e99;
      margin-top: 8px;
    }

    svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="call-screen">
    <div class="caller-info">
      <div class="caller-name" id="callerName">Человек-паук</div>
      <div class="caller-status" id="callerStatus">Входящий вызов</div>
    </div>

    <div class="incoming-controls">
      <div class="btn-circle-wrap">
        <button type="button" class="btn-circle btn-decline" id="btnDecline" aria-label="Отклонить">
          <svg viewBox="0 0 24 24" style="transform: rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
        </button>
        <span class="btn-label">Отклонить</span>
      </div>

      <div class="btn-circle-wrap">
        <button type="button" class="btn-circle btn-accept" id="btnAccept" aria-label="Ответить">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
        </button>
        <span class="btn-label">Ответить</span>
      </div>
    </div>

    <div class="active-controls">
      <div class="call-grid">
        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnMute">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-4 8.93V22h-2v-2.07A8.001 8.001 0 014 12h2a6 6 0 0012 0h2a8.001 8.001 0 01-7 7.93z"/></svg>
          </button>
          <span class="grid-label">Выкл. звук</span>
        </div>

        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnKeypad">
            <svg viewBox="0 0 24 24"><path d="M12 19a2 2 0 100 4 2 2 0 000-4zM6 1a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4zm12-8a2 2 0 100-4 2 2 0 000 4zm-6 8a2 2 0 100 4 2 2 0 000-4zm6 0a2 2 0 100 4 2 2 0 000-4zm0-6a2 2 0 100 4 2 2 0 000-4zm-6 0a2 2 0 100 4 2 2 0 000-4zm0-6a2 2 0 100 4 2 2 0 000-4z"/></svg>
          </button>
          <span class="grid-label">Клавиши</span>
        </div>

        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnSpeaker">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <span class="grid-label">Динамик</span>
        </div>

        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnAddCall">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <span class="grid-label">Добавить</span>
        </div>

        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnVideo">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
          <span class="grid-label">Видео</span>
        </div>

        <div class="grid-item">
          <button type="button" class="grid-btn" id="btnContacts">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </button>
          <span class="grid-label">Контакты</span>
        </div>
      </div>

      <button type="button" class="btn-circle btn-decline" id="btnEndCall" aria-label="Завершить">
        <svg viewBox="0 0 24 24" style="transform: rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Чёрный экран ожидания и завершённого звонка -->
  <div class="standby-screen" id="standbyScreen">
    <div id="standbyTimerText"></div>
  </div>

  <div class="secret-modal" id="secretModal">
    <div class="modal-header">
      <div class="modal-title">Панель управления вызовом</div>
      <button type="button" class="btn-close-modal" id="btnCloseModal">Закрыть</button>
    </div>

    <!-- БЛОК 1: ЗАПИСЬ СВОЕГО ГОЛОСА -->
    <div class="setting-group">
      <label class="setting-label">1. Сказать фразу в микрофон (с изменением голоса)</label>
      <div class="rec-controls">
        <button type="button" class="btn-rec" id="btnRecord">Записать голос</button>
        <button type="button" class="btn-preview" id="btnPreviewRec" disabled>Прослушать</button>
      </div>
      <div class="pitch-pills" id="pitchContainer">
        <button type="button" class="pitch-btn selected" data-pitch="0.82">Маска героя (ниже)</button>
        <button type="button" class="pitch-btn" data-pitch="1.18">Питер Паркер (выше)</button>
        <button type="button" class="pitch-btn" data-pitch="1.0">Обычный тон</button>
      </div>
      <div class="status-hint" id="recStatus">Нажми «Записать», скажи текст и нажми «Стоп»</div>
    </div>

    <!-- БЛОК 2: MP3 ИЗ GITHUB -->
    <div class="setting-group">
      <label class="setting-label">2. Или выбрать готовый MP3 из GitHub (/audio)</label>
      <div class="row-flex">
        <select class="setting-select" id="trackSelect">
          <option value="">Загрузка списка...</option>
        </select>
        <button type="button" class="btn-small" id="btnRefreshTracks">Обновить</button>
      </div>
      <div class="status-hint" id="githubStatus">Проверяем папку audio...</div>
    </div>

    <!-- БЛОК 3: ФИЛЬТР СВЯЗИ -->
    <div class="setting-group">
      <label class="setting-label">3. Эффект рации/телефона (при нажатии «Динамик»)</label>
      <div class="preset-pills">
        <button type="button" class="preset-btn" data-preset="clean">Оригинал (без частотного фильтра)</button>
        <button type="button" class="preset-btn selected" data-preset="gsm">Сотовая связь (реалистичный телефон)</button>
        <button type="button" class="preset-btn" data-preset="walkie">Рация / Маска героя (плотный фильтр)</button>
      </div>
    </div>

    <!-- БЛОК 4: ИМЯ, ФОН, ЗАДЕРЖКА -->
    <div class="setting-group">
      <label class="setting-label">4. Имя звонящего и задержка старта</label>
      <input type="text" class="setting-input" id="inputHeroName" value="Человек-паук" style="margin-bottom: 10px;" />
      <select class="setting-select" id="delaySelect" style="margin-bottom: 10px;">
        <option value="0">Звонок сразу (0 сек)</option>
        <option value="5">Задержка 5 секунд (успеть положить)</option>
        <option value="10">Задержка 10 секунд</option>
        <option value="15">Задержка 15 секунд</option>
      </select>
      <label class="setting-label" style="margin-top: 6px;">Сменить картинку фона (опционально):</label>
      <input type="file" accept="image/*" class="setting-input" id="bgImageInput" />
    </div>

    <button type="button" class="btn-launch" id="btnStartScenario">Применить и запустить вызов</button>
  </div>

  <audio id="voicePlayer" crossorigin="anonymous" preload="auto"></audio>
  <audio id="ringtonePlayer" src="audio/ringtone.mp3" loop preload="auto"></audio>

  <script>
    const GITHUB_CONFIG = {
      username: 'quakebass-bit',
      repo: 'callSpiderman',
      folder: 'audio'
    };

    const callerNameEl = document.getElementById('callerName');
    const callerStatusEl = document.getElementById('callerStatus');
    const btnAccept = document.getElementById('btnAccept');
    const btnDecline = document.getElementById('btnDecline');
    const btnEndCall = document.getElementById('btnEndCall');
    const btnSpeaker = document.getElementById('btnSpeaker');
    const voicePlayer = document.getElementById('voicePlayer');
    const ringtonePlayer = document.getElementById('ringtonePlayer');
    const bgLayer = document.getElementById('bgLayer');

    const secretModal = document.getElementById('secretModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const trackSelect = document.getElementById('trackSelect');
    const btnRefreshTracks = document.getElementById('btnRefreshTracks');
    const githubStatus = document.getElementById('githubStatus');
    const inputHeroName = document.getElementById('inputHeroName');
    const bgImageInput = document.getElementById('bgImageInput');
    const delaySelect = document.getElementById('delaySelect');
    const btnStartScenario = document.getElementById('btnStartScenario');
    const standbyScreen = document.getElementById('standbyScreen');
    const standbyTimerText = document.getElementById('standbyTimerText');

    // Элементы диктофона
    const btnRecord = document.getElementById('btnRecord');
    const btnPreviewRec = document.getElementById('btnPreviewRec');
    const recStatus = document.getElementById('recStatus');

    let isSpeakerOn = false;
    let isSleepMode = false;
    let currentPreset = localStorage.getItem('hero_preset') || 'gsm';
    let selectedAudioUrl = localStorage.getItem('hero_track_url') || '';
    let callTimerInterval = null;
    let ringtoneInterval = null;
    let callSeconds = 0;

    // Переменные для записи и смены тона голоса
    let mediaRecorder = null;
    let recordedChunks = [];
    let rawRecordedBuffer = null;
    let processedVoiceUrl = null;
    let selectedPitch = 0.82;
    let isRecording = false;

    let audioCtx = null;
    let sourceNode = null;
    let highpassFilter = null;
    let lowpassFilter = null;
    let gainNode = null;
    let waveShaper = null;

    const savedName = localStorage.getItem('hero_name');
    if (savedName) {
      callerNameEl.textContent = savedName;
      inputHeroName.value = savedName;
    }

    const savedBg = localStorage.getItem('hero_bg_data');
    if (savedBg) {
      bgLayer.style.backgroundImage = `url(${savedBg})`;
    }

    function initAudioEngine() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        sourceNode = audioCtx.createMediaElementSource(voicePlayer);
        highpassFilter = audioCtx.createBiquadFilter();
        lowpassFilter = audioCtx.createBiquadFilter();
        waveShaper = audioCtx.createWaveShaper();
        gainNode = audioCtx.createGain();

        highpassFilter.type = 'highpass';
        lowpassFilter.type = 'lowpass';

        sourceNode.connect(highpassFilter);
        highpassFilter.connect(lowpassFilter);
        lowpassFilter.connect(waveShaper);
        waveShaper.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        applyAudioFilter();
      } catch (e) {
        console.warn('Web Audio API fallback:', e);
      }
    }

    function makeDistortionCurve(amount) {
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function applyAudioFilter() {
      if (!audioCtx || !highpassFilter) return;

      if (!isSpeakerOn) {
        highpassFilter.frequency.value = 450;
        lowpassFilter.frequency.value = 2800;
        waveShaper.curve = null;
        gainNode.gain.value = 0.45;
        return;
      }

      gainNode.gain.value = 1.35;
      if (currentPreset === 'clean') {
        highpassFilter.frequency.value = 20;
        lowpassFilter.frequency.value = 20000;
        waveShaper.curve = null;
      } else if (currentPreset === 'gsm') {
        highpassFilter.frequency.value = 300;
        lowpassFilter.frequency.value = 3400;
        waveShaper.curve = makeDistortionCurve(2);
      } else if (currentPreset === 'walkie') {
        highpassFilter.frequency.value = 550;
        lowpassFilter.frequency.value = 2500;
        waveShaper.curve = makeDistortionCurve(12);
      }
    }

    // ==========================================
    // ИЗМЕНЕНИЕ ТОНА ГОЛОСА (ГРАНУЛЯРНЫЙ PITCH SHIFT С СОХРАНЕНИЕМ СКОРОСТИ)
    // ==========================================
    function pitchShiftBuffer(audioBuffer, pitchFactor) {
      if (pitchFactor === 1.0) return audioBuffer;

      const sampleRate = audioBuffer.sampleRate;
      const inputData = audioBuffer.getChannelData(0);
      const length = inputData.length;
      const outputBuffer = new AudioBuffer({ length, numberOfChannels: 1, sampleRate });
      const outputData = outputBuffer.getChannelData(0);

      const grainSize = Math.floor(sampleRate * 0.045); // 45 мс окно
      const overlap = Math.floor(grainSize * 0.5);
      const step = grainSize - overlap;

      for (let outPos = 0; outPos < length - grainSize; outPos += step) {
        for (let i = 0; i < grainSize; i++) {
          // Окно Ханна для плавной склейки без щелчков
          const win = 0.5 * (1 - Math.cos((2 * Math.PI * i) / grainSize));
          const readIdx = outPos + i * pitchFactor;
          const idx0 = Math.floor(readIdx);
          const frac = readIdx - idx0;
          if (idx0 + 1 < length) {
            const sample = inputData[idx0] * (1 - frac) + inputData[idx0 + 1] * frac;
            outputData[outPos + i] += sample * win;
          }
        }
      }
      return outputBuffer;
    }

    // Конвертация AudioBuffer в WAV Blob для воспроизведения в <audio>
    function audioBufferToWavBlob(buffer) {
      const numOfChan = 1;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new ArrayBuffer(length);
      const view = new DataView(out);
      const sampleRate = buffer.sampleRate;
      const channelData = buffer.getChannelData(0);

      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + buffer.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numOfChan, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, buffer.length * 2, true);

      let offset = 44;
      for (let i = 0; i < buffer.length; i++) {
        let s = Math.max(-1, Math.min(1, channelData[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    function rebuildVoiceRecording() {
      if (!rawRecordedBuffer) return;
      const shifted = pitchShiftBuffer(rawRecordedBuffer, selectedPitch);
      const wavBlob = audioBufferToWavBlob(shifted);
      if (processedVoiceUrl) URL.revokeObjectURL(processedVoiceUrl);
      processedVoiceUrl = URL.createObjectURL(wavBlob);
      selectedAudioUrl = processedVoiceUrl;
      btnPreviewRec.disabled = false;
      recStatus.textContent = 'Готово! Запись активна для следующего звонка.';
    }

    // Выбор тембра голоса
    document.querySelectorAll('.pitch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pitch-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedPitch = parseFloat(btn.dataset.pitch);
        rebuildVoiceRecording();
      });
    });

    // Кнопка записи с микрофона
    btnRecord.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            recStatus.textContent = 'Обрабатываем тембр...';
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const arrayBuf = await blob.arrayBuffer();
            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            rawRecordedBuffer = await tempCtx.decodeAudioData(arrayBuf);
            rebuildVoiceRecording();
          };

          mediaRecorder.start();
          isRecording = true;
          btnRecord.textContent = 'Стоп (идёт запись...)';
          btnRecord.classList.add('recording');
          btnPreviewRec.disabled = true;
          recStatus.textContent = 'Говорите в микрофон...';
        } catch (err) {
          recStatus.textContent = 'Нет доступа к микрофону (разрешите в браузере)';
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btnRecord.textContent = 'Перезаписать голос';
        btnRecord.classList.remove('recording');
      }
    });

    // Кнопка предпрослушивания записанного голоса
    btnPreviewRec.addEventListener('click', () => {
      if (!processedVoiceUrl) return;
      const previewAudio = new Audio(processedVoiceUrl);
      previewAudio.play();
    });

    // ==========================================
    // ЛОГИКА ЗВОНКА
    // ==========================================
    function startRingtone() {
      stopRingtone();
      isSleepMode = false;
      standbyScreen.classList.remove('visible');
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);

      ringtonePlayer.currentTime = 0;
      ringtonePlayer.play().catch(() => {
        const playTone = () => {
          if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
          try {
            if (!audioCtx) initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.15, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.85);
          } catch (e) {}
        };
        playTone();
        ringtoneInterval = setInterval(playTone, 2200);
      });
    }

    function stopRingtone() {
      ringtonePlayer.pause();
      ringtonePlayer.currentTime = 0;
      if (ringtoneInterval) clearInterval(ringtoneInterval);
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function playEndBeep() {
      try {
        if (!audioCtx) initAudioEngine();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 425;
        g.gain.value = 0.15;
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    btnAccept.addEventListener('click', () => {
      initAudioEngine();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      stopRingtone();
      document.body.classList.add('in-call');
      isSpeakerOn = false;
      btnSpeaker.classList.remove('active');
      applyAudioFilter();

      callSeconds = 0;
      callerStatusEl.textContent = '00:00';
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        callerStatusEl.textContent = formatTime(callSeconds);
      }, 1000);

      if (selectedAudioUrl) {
        voicePlayer.src = selectedAudioUrl;
        voicePlayer.play().catch(err => console.log('Ошибка воспроизведения:', err));
      }
    });

    btnSpeaker.addEventListener('click', () => {
      isSpeakerOn = !isSpeakerOn;
      btnSpeaker.classList.toggle('active', isSpeakerOn);
      applyAudioFilter();
    });

    ['btnMute', 'btnKeypad', 'btnAddCall', 'btnVideo', 'btnContacts'].forEach(id => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });

    function finishCall() {
      stopRingtone();
      voicePlayer.pause();
      voicePlayer.currentTime = 0;
      if (callTimerInterval) clearInterval(callTimerInterval);
      playEndBeep();

      callerStatusEl.textContent = 'Вызов завершён';
      setTimeout(() => {
        document.body.classList.remove('in-call');
        callerStatusEl.textContent = 'Входящий вызов';
        isSpeakerOn = false;
        btnSpeaker.classList.remove('active');

        isSleepMode = true;
        standbyTimerText.textContent = '';
        standbyScreen.classList.add('visible');
      }, 1000);
    }

    standbyScreen.addEventListener('click', () => {
      if (isSleepMode) {
        isSleepMode = false;
        standbyScreen.classList.remove('visible');
      }
    });

    btnDecline.addEventListener('click', finishCall);
    btnEndCall.addEventListener('click', finishCall);
    voicePlayer.addEventListener('ended', finishCall);

    // Открытие секретного меню
    let pressTimer = null;
    const openSecretMenu = () => {
      stopRingtone();
      secretModal.classList.add('open');
    };

    const startPress = () => {
      pressTimer = setTimeout(openSecretMenu, 1500);
    };
    const cancelPress = () => {
      if (pressTimer) clearTimeout(pressTimer);
    };

    callerNameEl.addEventListener('touchstart', startPress, { passive: true });
    callerNameEl.addEventListener('touchend', cancelPress);
    callerNameEl.addEventListener('mousedown', startPress);
    callerNameEl.addEventListener('mouseup', cancelPress);

    let tapCount = 0;
    let tapResetTimer = null;
    callerStatusEl.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapResetTimer);
      if (tapCount >= 3) {
        tapCount = 0;
        openSecretMenu();
      } else {
        tapResetTimer = setTimeout(() => { tapCount = 0; }, 700);
      }
    });

    btnCloseModal.addEventListener('click', () => {
      secretModal.classList.remove('open');
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      if (btn.dataset.preset === currentPreset) btn.classList.add('selected');
      else btn.classList.remove('selected');

      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentPreset = btn.dataset.preset;
        localStorage.setItem('hero_preset', currentPreset);
        applyAudioFilter();
      });
    });

    async function loadGithubTracks() {
      const { username, repo, folder } = GITHUB_CONFIG;
      githubStatus.textContent = 'Обновляем список с GitHub...';
      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Папка не найдена');
        const files = await response.json();

        const mp3Files = files
          .filter(f => f.name.toLowerCase().endsWith('.mp3') && f.name.toLowerCase() !== 'ringtone.mp3')
          .sort((a, b) => a.name.localeCompare(b.name, 'ru', { numeric: true }));

        localStorage.setItem('hero_cached_tracks', JSON.stringify(mp3Files));
        renderTrackOptions(mp3Files);
        githubStatus.textContent = `Найдено файлов: ${mp3Files.length}`;
      } catch (e) {
        const cached = localStorage.getItem('hero_cached_tracks');
        if (cached) {
          const parsed = JSON.parse(cached);
          renderTrackOptions(parsed);
          githubStatus.textContent = `Из кэша: ${parsed.length}`;
        } else {
          githubStatus.textContent = 'Папка audio на GitHub не найдена';
        }
      }
    }

    function renderTrackOptions(files) {
      trackSelect.innerHTML = '';
      if (files.length === 0) {
        trackSelect.innerHTML = '<option value="">В папке audio нет MP3</option>';
        return;
      }
      files.forEach(file => {
        const opt = document.createElement('option');
        opt.value = file.download_url;
        opt.textContent = file.name.replace(/\.mp3$/i, '');
        if (file.download_url === selectedAudioUrl) opt.selected = true;
        trackSelect.appendChild(opt);
      });
      if (!selectedAudioUrl && files[0]) {
        selectedAudioUrl = files[0].download_url;
      }
    }

    // Если выбрали трек из списка GitHub — переключаемся на него
    trackSelect.addEventListener('change', () => {
      selectedAudioUrl = trackSelect.value;
      localStorage.setItem('hero_track_url', selectedAudioUrl);
      recStatus.textContent = 'Выбран файл с GitHub (запись с микрофона отключена)';
    });

    btnRefreshTracks.addEventListener('click', loadGithubTracks);

    bgImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        bgLayer.style.backgroundImage = `url(${dataUrl})`;
        try {
          localStorage.setItem('hero_bg_data', dataUrl);
        } catch (err) {}
      };
      reader.readAsDataURL(file);
    });

    btnStartScenario.addEventListener('click', () => {
      const newName = inputHeroName.value.trim() || 'Человек-паук';
      callerNameEl.textContent = newName;
      localStorage.setItem('hero_name', newName);

      // Если свежая голосовая запись не активна, берём выбранный трек из списка GitHub
      if (!selectedAudioUrl && trackSelect.value) {
        selectedAudioUrl = trackSelect.value;
        localStorage.setItem('hero_track_url', selectedAudioUrl);
      }

      secretModal.classList.remove('open');
      isSleepMode = false;
      const delay = parseInt(delaySelect.value, 10);

      if (delay > 0) {
        let left = delay;
        standbyTimerText.textContent = `Вызов через ${left} сек... (положи телефон)`;
        standbyScreen.classList.add('visible');
        const t = setInterval(() => {
          left--;
          if (left <= 0) {
            clearInterval(t);
            standbyScreen.classList.remove('visible');
            startRingtone();
          } else {
            standbyTimerText.textContent = `Вызов через ${left} сек...`;
          }
        }, 1000);
      } else {
        startRingtone();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.update());
      });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    loadGithubTracks();
  </script>
</body>
</html>
